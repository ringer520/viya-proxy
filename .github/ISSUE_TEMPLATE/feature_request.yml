name: 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明「要解决什么问题」和「为什么现有行为不够用」。Viya 刻意保持单二进制、零运行时依赖，涉及新增外部服务、常驻进程或运行时依赖的建议通常不会被采纳。

  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题
      description: 描述真实场景，不要只写想要的界面
      placeholder: "我在局域网里有多台设备需要……目前只能……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望面板怎么工作，涉及哪些页面或接口
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
      description: 现有功能能否组合实现？为什么不够？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我搜索过已有 issue，确认没有重复建议
          required: true
        - label: 我已阅读 README 的功能概览，确认该功能目前不存在
          required: true
